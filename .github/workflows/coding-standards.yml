name: Laravel EC2 Deployment

# Trigger workflow on push to the 2.x branch
on:
  push:
    branches:
      - 2.x

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step 2: Set up the SSH connection using a trusted action
    - name: Setup SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_KEY }}
        known_hosts: 'just-a-placeholder' # Action handles known hosts securely

    # Step 3: Deploy commands using SSH
    - name: Deploy Laravel to EC2
      run: |
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          echo "=== Navigating to project folder ==="
          cd ${{ secrets.TARGET_DIR }}

          echo "=== Pull latest code ==="
          git reset --hard
          git pull origin main

          echo "=== Install Composer dependencies ==="
          composer install --no-interaction --prefer-dist --optimize-autoloader

          echo "=== Run database migrations ==="
          php artisan migrate --force

          echo "=== Clear all caches ==="
          php artisan cache:clear
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

          echo "=== Cache configs and routes ==="
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "=== Deployment complete successfully! ==="
        EOF


